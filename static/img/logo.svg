<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Northbridge logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4f9a"/>
      <stop offset="1" stop-color="#071a3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d36b"/>
      <stop offset="1" stop-color="#c8960f"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <!-- shield -->
  <path d="M100 26 L156 46 V96 C156 132 132 158 100 174 C68 158 44 132 44 96 V46 Z"
        fill="none" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <!-- bridge arch -->
  <path d="M62 120 Q100 74 138 120" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <line x1="58" y1="122" x2="142" y2="122" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
    <line x1="80" y1="104" x2="80" y2="122"/>
    <line x1="100" y1="97" x2="100" y2="122"/>
    <line x1="120" y1="104" x2="120" y2="122"/>
  </g>
  <!-- north star -->
  <path d="M100 48 L105 64 L121 69 L105 74 L100 90 L95 74 L79 69 L95 64 Z" fill="url(#gold)"/>
  <text x="100" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="20" font-weight="700" letter-spacing="3" fill="#f3d36b">NPA</text>
</svg>
